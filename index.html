<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>能量日誌</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Noto Serif TC';
            font-style: normal;
            font-weight: 600;
            font-display: swap;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #1a1625;
            --card: rgba(255,255,255,0.05);
            --border: rgba(255,255,255,0.1);
            --text: #e8dcc8;
            --text-muted: rgba(232,220,200,0.5);
            --accent: #f0a868;
            --success: #66bb6a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1625 0%, #0f0a18 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 10px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            font-family: 'Noto Serif TC', serif;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .load-indicator {
            font-size: 12px;
            color: var(--accent);
            margin-top: 8px;
            min-height: 16px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .load-indicator.done {
            animation: none;
            opacity: 1;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            font-family: 'Noto Serif TC', serif;
            color: var(--accent);
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 1px;
        }

        .slider-group {
            margin-bottom: 24px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .slider-label span:first-child {
            font-weight: 500;
        }

        .slider-value {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .slider-value .num {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
            min-width: 30px;
        }

        .slider-value .word {
            font-size: 13px;
            color: var(--text-muted);
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 10px;
            background: linear-gradient(to right, rgba(240,168,104,0.2), var(--accent));
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: white;
            border: 3px solid var(--accent);
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }

        input[type="range"]::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: white;
            border: 3px solid var(--accent);
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }

        .activities {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .activity-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-align: center;
        }

        .activity-btn:hover {
            background: rgba(255,255,255,0.08);
        }

        .activity-btn.active {
            background: rgba(240,168,104,0.15);
            border-color: rgba(240,168,104,0.8);
            color: #f0b888;
            box-shadow: 0 4px 12px rgba(240,168,104,0.15);
        }

        .activity-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 40px;
        }

        textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(255,255,255,0.04);
            color: var(--text);
            font-size: 16px;
            font-family: inherit;
            resize: none;
            outline: none;
            transition: all 0.2s ease;
            min-height: 80px;
        }

        textarea:focus {
            background: rgba(255,255,255,0.08);
            border-color: var(--accent);
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        .text-group {
            margin-bottom: 20px;
        }

        .text-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .char-count {
            font-size: 12px;
            color: var(--text-muted);
            text-align: right;
            margin-top: 5px;
        }

        .error {
            background: rgba(220,90,90,0.15);
            border: 1px solid rgba(220,90,90,0.4);
            color: #ff9999;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #f0b888 0%, #e8835a 100%);
            color: #2a1c12;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 600;
            font-family: 'Noto Serif TC', serif;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 1px;
            box-shadow: 0 8px 24px rgba(232,131,90,0.3);
            margin-top: 8px;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(232,131,90,0.4);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* F1：週回顧（只呈現趨勢；單色、固定 Y 軸、無互動） */
        .weekly-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .weekly-label {
            width: 36px;
            flex: none;
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 1px;
        }
        .weekly-row svg {
            flex: 1 1 0;
            min-width: 0;      /* 蓋掉 SVG 300px 內建寬度，讓 flex 能壓縮 */
            width: 0;
            height: 44px;
            display: block;
            overflow: visible;
        }
        .weekly-num {
            width: 36px;
            flex: none;
            text-align: right;
            font-size: 15px;
            font-weight: 700;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
        }
        .weekly-axis {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 10px;
        }
        .weekly-axis .spacer { width: 36px; flex: none; }
        .weekly-weeks {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
        }
        .weekly-week {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }
        .weekly-dots {
            display: flex;
            justify-content: center;
            gap: 3px;
            margin-top: 6px;
            min-height: 6px;
        }
        .weekly-dots i {
            display: block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            box-sizing: border-box;
            background: var(--text-muted);
        }
        .weekly-dots i.hollow {
            background: transparent;
            border: 1px solid var(--text-muted);
        }
        .weekly-echo {
            border-top: 1px solid var(--border);
            margin-top: 18px;
            padding-top: 14px;
        }
        .weekly-echo-meta {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        .weekly-echo-text {
            margin-top: 6px;
            font-size: 14px;
            line-height: 1.7;
            color: var(--text);
            font-family: 'Noto Serif TC', serif;
        }

        /* F0：跳過標記（次要選項，低對比、無強調） */
        .skip-btn {
            display: block;
            width: 100%;
            margin-top: 14px;
            padding: 10px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            font-family: 'Noto Sans TC', sans-serif;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .skip-btn:hover:not(:disabled) {
            color: var(--text);
        }
        .skip-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* F0：該日已留記號，分數區塊淡化，代表目前沒有分數資料 */
        .card.muted {
            opacity: 0.45;
            transition: opacity 0.3s ease;
        }

        .success-modal {
            position: fixed;
            inset: 0;
            background: rgba(10,5,20,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(3px);
        }

        .success-modal.show {
            display: flex;
        }

        .success-card {
            background: #1a1625;
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 280px;
        }

        .success-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(240,168,104,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;
        }

        .success-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }

        .success-text {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        @keyframes popIn {
            from {
                transform: scale(0.7);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="dateStr">今天</h1>
            <p>晚間記錄 · 今晚也辛苦了</p>
            <div class="load-indicator" id="loadIndicator"></div>
        </div>

        <div class="error" id="errorMsg"></div>

        <!-- F1：週回顧。資料不足或載入失敗時整個隱藏，不顯示任何文字 -->
        <div class="card" id="weeklyReview" hidden>
            <div class="card-title">這幾週</div>
            <div id="weeklyRows"></div>
            <div class="weekly-axis">
                <div class="spacer"></div>
                <div class="weekly-weeks" id="weeklyWeeks"></div>
                <div class="spacer"></div>
            </div>
            <div class="weekly-echo" id="weeklyEcho" hidden>
                <div class="weekly-echo-meta" id="weeklyEchoMeta"></div>
                <div class="weekly-echo-text" id="weeklyEchoText"></div>
            </div>
        </div>

        <!-- 心理狀態 -->
        <div class="card" id="scoreCard">
            <div class="card-title">心理狀態</div>
            
            <div class="slider-group">
                <div class="slider-label">
                    <span>壓力分數</span>
                    <div class="slider-value">
                        <span class="word" id="pressureWord">還好</span>
                        <span class="num" id="pressureNum">5</span>
                    </div>
                </div>
                <input type="range" id="pressure" min="1" max="10" value="5">
            </div>

            <div class="slider-group">
                <div class="slider-label">
                    <span>思路清晰度</span>
                    <div class="slider-value">
                        <span class="word" id="clarityWord">普通</span>
                        <span class="num" id="clarityNum">5</span>
                    </div>
                </div>
                <input type="range" id="clarity" min="1" max="10" value="5">
            </div>

            <div class="slider-group">
                <div class="slider-label">
                    <span>睡前電量</span>
                    <div class="slider-value">
                        <span class="word" id="energyWord">一半</span>
                        <span class="num" id="energyNum">5</span>
                    </div>
                </div>
                <input type="range" id="energy" min="1" max="10" value="5">
            </div>
        </div>

        <!-- 今日活動 -->
        <div class="card">
            <div class="card-title">今日活動</div>
            <div class="activities">
                <button class="activity-btn" id="walkBtn" onclick="toggleActivity('walk')">
                    <span class="activity-icon">
                        <svg width="38" height="38" viewBox="0 0 40 40" fill="currentColor">
                            <ellipse cx="15" cy="14" rx="4.2" ry="6.2" transform="rotate(-14 15 14)"></ellipse>
                            <ellipse cx="25" cy="26" rx="4.2" ry="6.2" opacity="0.5" transform="rotate(-14 25 26)"></ellipse>
                        </svg>
                    </span>
                    <span>散步</span>
                </button>
                <button class="activity-btn" id="meditateBtn" onclick="toggleActivity('meditate')">
                    <span class="activity-icon">
                        <svg width="38" height="38" viewBox="0 0 40 40" fill="currentColor">
                            <circle cx="20" cy="20" r="3.6"></circle>
                            <circle cx="20" cy="20" r="8.5" fill="none" stroke="currentColor" stroke-width="2" opacity="0.5"></circle>
                            <circle cx="20" cy="20" r="13.5" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.25"></circle>
                            <circle cx="20" cy="4.2" r="1.6"></circle>
                            <circle cx="20" cy="35.8" r="1.6"></circle>
                            <circle cx="4.2" cy="20" r="1.6"></circle>
                            <circle cx="35.8" cy="20" r="1.6"></circle>
                            <circle cx="8.8" cy="8.8" r="1.3" opacity="0.7"></circle>
                            <circle cx="31.2" cy="8.8" r="1.3" opacity="0.7"></circle>
                            <circle cx="8.8" cy="31.2" r="1.3" opacity="0.7"></circle>
                            <circle cx="31.2" cy="31.2" r="1.3" opacity="0.7"></circle>
                        </svg>
                    </span>
                    <span>冥想</span>
                </button>
                <button class="activity-btn" id="strengthBtn" onclick="toggleActivity('strength')">
                    <span class="activity-icon">
                        <svg width="38" height="38" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 8 Q20 4.5 34 8"></path>
                            <rect x="2.6" y="4.4" width="3.2" height="7.2" rx="1.4" fill="currentColor" stroke="none"></rect>
                            <rect x="34.2" y="4.4" width="3.2" height="7.2" rx="1.4" fill="currentColor" stroke="none"></rect>
                            <circle cx="20" cy="14" r="3.5" fill="currentColor" stroke="none"></circle>
                            <path d="M8 8 L16 19.5"></path>
                            <path d="M32 8 L24 19.5"></path>
                            <path d="M16 19.5 H24"></path>
                            <path d="M20 19.5 V28"></path>
                            <path d="M20 28 L14.5 36"></path>
                            <path d="M20 28 L25.5 36"></path>
                        </svg>
                    </span>
                    <span>重訓</span>
                </button>
                <button class="activity-btn" id="runBtn" onclick="toggleActivity('run')">
                    <span class="activity-icon">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1l-5.2 2.2v4.7h2v-3.4l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"></path>
                        </svg>
                    </span>
                    <span>跑步</span>
                </button>
            </div>
        </div>

        <!-- 感恩與反思 -->
        <div class="card">
            <div class="card-title">感恩與反思</div>
            
            <div class="text-group">
                <div class="text-label">感恩日誌</div>
                <textarea id="gratitude" placeholder="今天，謝謝什麼？" maxlength="100"></textarea>
                <div class="char-count"><span id="gratitudeCount">0</span>/100</div>
            </div>

            <div class="text-group">
                <div class="text-label">反思</div>
                <textarea id="reflection" placeholder="任何想留下的觀察或想法⋯" maxlength="100"></textarea>
                <div class="char-count"><span id="reflectionCount">0</span>/100</div>
            </div>
        </div>

        <button class="submit-btn" id="submitBtn" onclick="submitForm()">完成今晚的紀錄 ✨</button>
        <button class="skip-btn" id="skipBtn" onclick="submitSkip()">今天不記分數，只留個記號</button>
    </div>

    <div class="success-modal" id="successModal">
        <div class="success-card">
            <div class="success-icon">✓</div>
            <div class="success-title" id="successTitle">今晚完成</div>
            <div class="success-text" id="successText">你又好好走過了<br>美好的一天</div>
        </div>
    </div>

    <script>
        // 設定 Google Apps Script URL
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzHkyqqM0vOus7M0B2IHIFhaktRTenSL7c_2t12OtlYF1RuvY1jn1mugQzsHcBmltwc/exec';

        // 狀態物件
        const state = {
            pressure: 5,
            clarity: 5,
            energy: 5,
            walk: false,
            meditate: false,
            strength: false,
            run: false,
            gratitude: '',
            reflection: '',
            submitting: false,
            skip: false          // F0：該日期目前是否為「跳過」狀態
        };

        // 初始化
        function init() {
            updateDate();
            setupSliders();
            setupTextareas();
            loadTodayRecord(); // 預填充功能
            loadWeeklyReview(); // F1：與預填充並行，互不等待
        }

        function updateDate() {
            const taipei = new Date();
            const utc = taipei.getTime() + (taipei.getTimezoneOffset() * 60000);
            const tw = new Date(utc + (8 * 60 * 60000));
            
            const dateStr = tw.toLocaleDateString('zh-TW', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            }) + ' ' + tw.toLocaleDateString('zh-TW', { weekday: 'long' });
            document.getElementById('dateStr').textContent = dateStr;
        }

        function setupSliders() {
            const sliders = ['pressure', 'clarity', 'energy'];
            sliders.forEach(name => {
                const slider = document.getElementById(name);
                slider.addEventListener('input', (e) => {
                    state[name] = parseInt(e.target.value);
                    updateSliderDisplay(name);
                    // F0：使用者開始填分數，離開跳過狀態
                    if (state.skip) {
                        state.skip = false;
                        document.getElementById('scoreCard').classList.remove('muted');
                    }
                });
            });
        }

        function updateSliderDisplay(name) {
            const val = state[name];
            document.getElementById(name + 'Num').textContent = val;
            
            let word = '';
            if (name === 'pressure') {
                word = val <= 2 ? '很放鬆' : val <= 4 ? '平穩' : val <= 6 ? '還好' : val <= 8 ? '有點緊' : '很緊繃';
            } else if (name === 'clarity') {
                word = val <= 2 ? '很模糊' : val <= 4 ? '有點朦' : val <= 6 ? '普通' : val <= 8 ? '清晰' : '非常清晰';
            } else if (name === 'energy') {
                word = val <= 2 ? '快沒電' : val <= 4 ? '偏低' : val <= 6 ? '一半' : val <= 8 ? '充足' : '滿電';
            }
            document.getElementById(name + 'Word').textContent = word;
        }

        function setupTextareas() {
            const textareas = ['gratitude', 'reflection'];
            textareas.forEach(name => {
                const ta = document.getElementById(name);
                ta.addEventListener('input', (e) => {
                    state[name] = e.target.value.slice(0, 100);
                    document.getElementById(name + 'Count').textContent = state[name].length;
                });
            });
        }

        function toggleActivity(name) {
            state[name] = !state[name];
            const btn = document.getElementById(name + 'Btn');
            btn.classList.toggle('active');
        }

        // ===== 台灣時區日期取得 =====
        function getTaiwanDate() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const taipei = new Date(utc + (8 * 60 * 60000)); // 台灣是 UTC+8
            
            const year = taipei.getFullYear();
            const month = String(taipei.getMonth() + 1).padStart(2, '0');
            const day = String(taipei.getDate()).padStart(2, '0');
            
            return `${year}-${month}-${day}`;
        }

        // ===== 預填充：載入當天的資料 =====
        async function loadTodayRecord() {
            const loadIndicator = document.getElementById('loadIndicator');
            loadIndicator.textContent = '📂 載入中...';

            try {
                const today = getTaiwanDate();
                const response = await fetch(`${SCRIPT_URL}?date=${today}`);
                const result = await response.json();

                if (result.success && result.found) {
                    // 有找到今天的記錄，填入表單
                    const data = result.data;

                    // F0：該日為「跳過」，分數為空，不設滑桿，只淡化分數區塊
                    const isSkip = data.跳過 === true;
                    state.skip = isSkip;
                    document.getElementById('scoreCard').classList.toggle('muted', isSkip);

                    // 填入滑桿值
                    if (data.壓力分數) {
                        state.pressure = data.壓力分數;
                        document.getElementById('pressure').value = data.壓力分數;
                        updateSliderDisplay('pressure');
                    }

                    if (data.思路清晰度) {
                        state.clarity = data.思路清晰度;
                        document.getElementById('clarity').value = data.思路清晰度;
                        updateSliderDisplay('clarity');
                    }

                    if (data.睡前電量) {
                        state.energy = data.睡前電量;
                        document.getElementById('energy').value = data.睡前電量;
                        updateSliderDisplay('energy');
                    }

                    // 填入活動按鈕
                    if (data.散步) {
                        state.walk = true;
                        document.getElementById('walkBtn').classList.add('active');
                    }
                    if (data.冥想) {
                        state.meditate = true;
                        document.getElementById('meditateBtn').classList.add('active');
                    }
                    if (data.重訓) {
                        state.strength = true;
                        document.getElementById('strengthBtn').classList.add('active');
                    }
                    if (data.跑步) {
                        state.run = true;
                        document.getElementById('runBtn').classList.add('active');
                    }

                    // 填入文字欄
                    if (data.輕量感恩) {
                        state.gratitude = data.輕量感恩;
                        document.getElementById('gratitude').value = data.輕量感恩;
                        document.getElementById('gratitudeCount').textContent = data.輕量感恩.length;
                    }

                    if (data.反思) {
                        state.reflection = data.反思;
                        document.getElementById('reflection').value = data.反思;
                        document.getElementById('reflectionCount').textContent = data.反思.length;
                    }

                    loadIndicator.textContent = isSkip ? '今天已留記號' : '✓ 已載入今日記錄';
                    loadIndicator.classList.add('done');
                } else {
                    // 今天還沒有記錄
                    loadIndicator.textContent = '準備好了 ✨';
                    loadIndicator.classList.add('done');
                }
            } catch (error) {
                console.error('載入失敗:', error);
                loadIndicator.textContent = '⚠️ 載入失敗';
                loadIndicator.classList.add('done');
            }
        }

        // ===== F1：週回顧 =====
        const WEEKLY_WEEKS = 4;          // 最近 4 週，含本週
        const WEEKLY_MIN_SCORED = 2;     // 該週至少 2 天有分數才畫點
        const WEEKLY_MIN_WEEKS = 2;      // 至少 2 週有點才顯示區塊
        const ECHO_MIN_AGO = 7;          // 回聲取材：7～28 天前
        const ECHO_MAX_AGO = 28;
        const WEEKLY_METRICS = [
            { key: '壓力分數', label: '壓力' },
            { key: '思路清晰度', label: '清晰' },
            { key: '睡前電量', label: '電量' }
        ];
        let weeklyData = null;   // 供 resize 重繪

        // 日期字串 → 天數索引（以 UTC 計，避免時區位移）
        function dayIndex(ymd) {
            const [y, m, d] = ymd.split('-').map(Number);
            return Math.round(Date.UTC(y, m - 1, d) / 86400000);
        }
        function ymdFromIndex(idx) {
            return new Date(idx * 86400000).toISOString().slice(0, 10);
        }
        // 該天所屬週的週一索引（週一為一週起始）
        function mondayIndex(idx) {
            const dow = (new Date(idx * 86400000).getUTCDay() + 6) % 7; // 週一=0
            return idx - dow;
        }
        function shortMD(ymd) {
            const [, m, d] = ymd.split('-').map(Number);
            return `${m}/${d}`;
        }

        async function loadWeeklyReview() {
            const card = document.getElementById('weeklyReview');
            try {
                const todayIdx = dayIndex(getTaiwanDate());
                const fromIdx = mondayIndex(todayIdx) - 7 * (WEEKLY_WEEKS - 1);
                const from = ymdFromIndex(fromIdx);
                const to = ymdFromIndex(todayIdx);
                const res = await fetch(`${SCRIPT_URL}?from=${from}&to=${to}`);
                const json = await res.json();
                if (!json.success || !Array.isArray(json.rows)) throw new Error(json.error || '格式錯誤');
                weeklyData = { rows: json.rows, fromIdx, todayIdx };
                renderWeeklyReview();
            } catch (err) {
                console.error('週回顧載入失敗:', err);
                card.hidden = true;
            }
        }

        function aggregateWeeks(rows, fromIdx) {
            const weeks = [];
            for (let w = 0; w < WEEKLY_WEEKS; w++) {
                const start = fromIdx + w * 7;
                weeks.push({ start, end: start + 6, scored: [], skipped: 0, avg: {} });
            }
            rows.forEach(r => {
                const idx = dayIndex(r.date);
                const w = weeks.find(x => idx >= x.start && idx <= x.end);
                if (!w) return;
                if (r.跳過 === true) { w.skipped++; return; }
                if (typeof r.壓力分數 === 'number') w.scored.push(r);
            });
            weeks.forEach(w => {
                WEEKLY_METRICS.forEach(m => {
                    if (w.scored.length >= WEEKLY_MIN_SCORED) {
                        const vals = w.scored.map(r => r[m.key]).filter(v => typeof v === 'number');
                        w.avg[m.key] = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
                    } else {
                        w.avg[m.key] = null;
                    }
                });
            });
            return weeks;
        }

        function renderWeeklyReview() {
            if (!weeklyData) return;
            const card = document.getElementById('weeklyReview');
            const { rows, fromIdx, todayIdx } = weeklyData;
            const weeks = aggregateWeeks(rows, fromIdx);

            const weeksWithPoints = weeks.filter(w => w.avg['壓力分數'] !== null).length;
            if (weeksWithPoints < WEEKLY_MIN_WEEKS) { card.hidden = true; return; }

            // 週標籤與密度點（實心＝有分數的天、空心＝跳過的天；其他日子不畫）
            document.getElementById('weeklyWeeks').innerHTML = weeks.map(w => {
                const dots = '<i></i>'.repeat(w.scored.length) + '<i class="hollow"></i>'.repeat(w.skipped);
                return `<div class="weekly-week">${shortMD(ymdFromIndex(w.start))}<div class="weekly-dots">${dots}</div></div>`;
            }).join('');

            // 三條 sparkline（先顯示卡片，才量得到寬度）
            card.hidden = false;
            const rowsEl = document.getElementById('weeklyRows');
            rowsEl.innerHTML = WEEKLY_METRICS.map(m => `
                <div class="weekly-row">
                    <div class="weekly-label">${m.label}</div>
                    <svg data-metric="${m.key}" aria-hidden="true"></svg>
                    <div class="weekly-num" data-metric="${m.key}"></div>
                </div>`).join('');

            WEEKLY_METRICS.forEach(m => drawSparkline(rowsEl, m.key, weeks));
            renderEcho(rows, todayIdx);
        }

        // Y 軸固定 1～10；avg 為 null 的週不畫點、線段中斷
        function drawSparkline(rowsEl, key, weeks) {
            const svg = rowsEl.querySelector(`svg[data-metric="${key}"]`);
            const numEl = rowsEl.querySelector(`.weekly-num[data-metric="${key}"]`);
            const W = Math.max(svg.getBoundingClientRect().width, 80);
            const H = 44, PAD = 6;
            svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
            const xAt = i => (i + 0.5) * (W / WEEKLY_WEEKS);
            const yAt = v => PAD + (H - 2 * PAD) * (1 - (v - 1) / 9);

            let d = '', pen = false, circles = '', last = null;
            weeks.forEach((w, i) => {
                const v = w.avg[key];
                if (v === null) { pen = false; return; }
                const x = xAt(i).toFixed(1), y = yAt(v).toFixed(1);
                d += (pen ? ` L ${x} ${y}` : ` M ${x} ${y}`);
                pen = true;
                circles += `<circle cx="${x}" cy="${y}" r="3" fill="var(--accent)"/>`;
                last = v;
            });
            svg.innerHTML =
                `<line x1="0" y1="${yAt(5.5)}" x2="${W}" y2="${yAt(5.5)}" stroke="var(--border)" stroke-width="1"/>` +
                `<path d="${d.trim()}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>` +
                circles;
            numEl.textContent = last === null ? '' : last.toFixed(1);
        }

        // 回聲：7～28 天前一則反思或感恩；以日期為種子，同一天內不換
        function renderEcho(rows, todayIdx) {
            const echo = document.getElementById('weeklyEcho');
            const candidates = [];
            rows.forEach(r => {
                const ago = todayIdx - dayIndex(r.date);
                if (ago < ECHO_MIN_AGO || ago > ECHO_MAX_AGO) return;
                if (r.反思 && r.反思.trim()) candidates.push({ date: r.date, kind: '反思', text: r.反思.trim() });
                if (r.輕量感恩 && r.輕量感恩.trim()) candidates.push({ date: r.date, kind: '感恩', text: r.輕量感恩.trim() });
            });
            if (!candidates.length) { echo.hidden = true; return; }
            const pick = candidates[todayIdx % candidates.length];
            document.getElementById('weeklyEchoMeta').textContent = `${shortMD(pick.date)} · ${pick.kind}`;
            document.getElementById('weeklyEchoText').textContent = pick.text;
            echo.hidden = false;
        }

        let weeklyResizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(weeklyResizeTimer);
            weeklyResizeTimer = setTimeout(renderWeeklyReview, 150);
        });

        function submitForm() {
            if (state.submitting) return;
            
            state.submitting = true;
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').textContent = '正在記錄⋯';
            document.getElementById('errorMsg').classList.remove('show');

            const today = getTaiwanDate();
            const data = {
                date: today,
                跳過: false,
                壓力分數: state.pressure,
                思路清晰度: state.clarity,
                睡前電量: state.energy,
                散步: state.walk,
                冥想: state.meditate,
                重訓: state.strength,
                跑步: state.run,
                輕量感恩: state.gratitude,
                反思: state.reflection
            };

            // 使用 no-cors 模式
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(data),
                headers: { 'Content-Type': 'application/json' }
            })
            .then(response => {
                // no-cors 模式下無法讀取響應，假設成功
                state.skip = false;
                document.getElementById('scoreCard').classList.remove('muted');
                showSuccess('今晚完成', '你又好好走過了<br>美好的一天');
                state.submitting = false;
                resetForm();
            })
            .catch(err => {
                showError('網路錯誤：' + err.message);
                state.submitting = false;
                resetForm();
            });
        }

        // ===== F0：跳過標記 =====
        // 分數三欄留空，活動與文字照當下狀態送出，跳過欄寫 TRUE。單擊即送出，不確認。
        function submitSkip() {
            if (state.submitting) return;
            state.submitting = true;
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('skipBtn').disabled = true;
            document.getElementById('skipBtn').textContent = '正在留記號⋯';
            document.getElementById('errorMsg').classList.remove('show');

            const today = getTaiwanDate();
            const data = {
                date: today,
                跳過: true,
                壓力分數: null,
                思路清晰度: null,
                睡前電量: null,
                散步: state.walk,
                冥想: state.meditate,
                重訓: state.strength,
                跑步: state.run,
                輕量感恩: state.gratitude,
                反思: state.reflection
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(data),
                headers: { 'Content-Type': 'application/json' }
            })
            .then(response => {
                state.skip = true;
                document.getElementById('scoreCard').classList.add('muted');
                document.getElementById('loadIndicator').textContent = '今天已留記號';
                showSuccess('記號留下了', '今天不記分數<br>也是一種選擇');
                state.submitting = false;
                resetForm();
            })
            .catch(err => {
                showError('網路錯誤：' + err.message);
                state.submitting = false;
                resetForm();
            });
        }

        function showSuccess(title, text) {
            document.getElementById('successTitle').textContent = title || '今晚完成';
            document.getElementById('successText').innerHTML = text || '你又好好走過了<br>美好的一天';
            document.getElementById('successModal').classList.add('show');
            setTimeout(() => {
                document.getElementById('successModal').classList.remove('show');
            }, 3000);
        }

        function showError(msg) {
            const errorEl = document.getElementById('errorMsg');
            errorEl.textContent = msg;
            errorEl.classList.add('show');
        }

        function resetForm() {
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').textContent = '完成今晚的紀錄 ✨';
            document.getElementById('skipBtn').disabled = false;
            document.getElementById('skipBtn').textContent = '今天不記分數，只留個記號';
        }

        // 頁面加載時初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
